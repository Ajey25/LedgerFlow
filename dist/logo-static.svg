<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backFolderGradStatic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#3a7bd5" />
    </linearGradient>

    <linearGradient id="barGradStatic" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <filter id="neonGlowStatic" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#neonGlowStatic)">
    <!-- Blue Back Folder Shape -->
    <rect x="48" y="40" width="70" height="110" rx="16" fill="url(#backFolderGradStatic)" />
    
    <!-- Dark Document Card (Front) -->
    <rect x="68" y="48" width="80" height="98" rx="12" fill="#0b0e14" stroke="#4a709c" stroke-width="2" />
    
    <!-- Folded Paper Corner -->
    <path d="M 132 48 L 148 64 L 132 64 Z" fill="#7fa8d9" opacity="0.8" />

    <!-- Text Lines -->
    <rect x="80" y="72" width="28" height="4" rx="2" fill="#8aa2c0" opacity="0.8" />
    <rect x="80" y="82" width="48" height="4" rx="2" fill="#8aa2c0" opacity="0.8" />
    <rect x="80" y="92" width="22" height="4" rx="2" fill="#8aa2c0" opacity="0.8" />

    <!-- Chart Bars -->
    <rect x="86" y="120" width="12" height="15" rx="3" fill="url(#barGradStatic)" />
    <rect x="104" y="110" width="12" height="25" rx="3" fill="url(#barGradStatic)" />
    <rect x="122" y="100" width="12" height="35" rx="3" fill="url(#barGradStatic)" />
  </g>
</svg>
